<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学进度记录 · ISDN</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #2b2f3a; --muted: #7a8194;
    --accent: #4f6ef7; --border: #e3e7ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 28px 20px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; line-height: 1.6; }

  /* ---------- 模块A ---------- */
  .moduleA { display: grid; gap: 16px; margin-bottom: 32px; }
  .progress-card { background: var(--card); border-radius: 14px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(30,40,80,.06); }
  .progress-card h2 { font-size: 15px; margin-bottom: 12px; }
  .bar-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .bar-label { font-size: 13px; color: var(--muted); }
  .bar-pct { font-size: 20px; font-weight: 700; }
  .track { height: 14px; background: #eef1f7; border-radius: 999px; overflow: hidden; margin-bottom: 4px; position: relative; }
  .fill { height: 100%; border-radius: 999px; transition: width .6s ease; background: linear-gradient(90deg,#4f6ef7,#7d9bff); }
  .fill.lite { position: absolute; top: 0; opacity: .38; border-radius: 0 999px 999px 0; transition: left .6s ease, width .6s ease; }
  .bar-note { font-size: 12px; color: var(--muted); }
  .subcats { margin-top: 18px; display: grid; gap: 14px; }
  .subcat .track { height: 10px; }
  .fill-1 { background: linear-gradient(90deg,#34a374,#6cc79c); }
  .fill-2 { background: linear-gradient(90deg,#ef8f3c,#f7b57a); }
  .fill-3 { background: linear-gradient(90deg,#9a66e8,#c1a4f5); }

  /* ---------- 模块B ---------- */
  .moduleB { display: grid; gap: 18px; }
  .course-card { background: var(--card); border-radius: 14px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(30,40,80,.06); }
  .course-card h2 { font-size: 16px; margin-bottom: 2px; }
  .course-card .desc { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .zone-title { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
  .zone-title .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .drop-zone {
    border: 2px dashed var(--border); border-radius: 10px; padding: 12px; min-height: 60px;
    transition: border-color .15s, background .15s; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
  }
  .drop-zone.drag-over { border-color: var(--accent); background: #f0f4ff; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: grab; user-select: none; border: 1px solid transparent;
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { opacity: .35; }
  .chip.done     { background: #e8f7f0; border-color: #b5e3cf; color: #1d7a52; }
  .chip.progress { background: #e3efff; border-color: #b3d1fb; color: #2258c4; }
  .chip.planned  { background: #fdf1e3; border-color: #f3d4ab; color: #a05e14; }
  .chip.other    { background: #f0f1f5; border-color: var(--border); color: #555c6e; }
  .chip.custom   { border-style: dotted; }
  .empty-hint { color: var(--muted); font-size: 12px; align-self: center; padding: 6px; }

  /* CC 领域槽位 */
  .slot-board { background: #f8f9fc; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .slot-group-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 8px; }
  .slot-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .slot {
    border: 2px dashed #cdd4e2; border-radius: 10px; padding: 10px 14px; min-width: 170px; min-height: 46px;
    background: #fff; transition: border-color .15s, background .15s; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .slot.drag-over { border-color: var(--accent); background: #f0f4ff; }
  .slot .slot-label { font-size: 12px; color: var(--muted); }
  .slot-hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .add-row input {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 180px;
  }
  .add-row button {
    border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }

  .tools { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }
  button.reset {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  button.reset:hover { color: var(--text); border-color: #c8cede; }
</style>
</head>

const STORE_KEY = "degree-tracker-v6";
const byId = Object.fromEntries(DATA.courses.map(c => [c.id, c]));
let statuses = {}, bindings = {}, customIds = [], renames = {}, freeCredits = [];
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  statuses = saved.statuses || {};
  bindings = saved.bindings || {};
  customIds = saved.customIds || [];
  renames = saved.renames || {};
  freeCredits = saved.freeCredits || [];
} catch (e) { /* ignore */ }
/* 应用已保存的课号编辑（ELEC 3xxx/4xxx → 实际课号） */
Object.entries(renames).forEach(([oldId, newId]) => {
  const c = byId[oldId];
  if (c && !byId[newId]) {
    c.id = newId; c.editId = true;
    byId[newId] = c; delete byId[oldId];
    if (statuses[oldId]) { statuses[newId] = statuses[oldId]; delete statuses[oldId]; }
  }
});
/* 恢复自定义添加的 CC 课 */
(customIds || []).forEach(id => {
  if (byId[id]) return;
  const c = { id, name: "自定义课程", cat: "cc", credit: 3, status: "other", custom: true };
  DATA.courses.push(c); byId[id] = c;
});
DATA.courses.forEach(c => { if (!statuses[c.id]) statuses[c.id] = c.status; });

function save() { localStorage.setItem(STORE_KEY, JSON.stringify({ statuses, bindings, customIds, renames, freeCredits, freeSeeded: true })); }
/* 一次性迁移：SOSC 1440（转学分）从 Common Core 移入 Free Credits */
try {
  if (!JSON.parse(localStorage.getItem(STORE_KEY) || "{}").freeSeeded) {
    if (!freeCredits.some(f => f.id === "SOSC 1440"))
      freeCredits.push({ id: "SOSC 1440", credit: 3, done: true });
    Object.keys(bindings).forEach(k => bindings[k] = (bindings[k] || []).filter(x => x !== "SOSC 1440"));
    save();
  }
} catch (e) { /* ignore */ }
const isBound = id => Object.values(bindings).some(arr => arr.includes(id));
function levelOf(c) {
  const m = c.id.match(/(\d{4})/);
  if (m) return parseInt(m[1]);
  if (c.id.includes("3xxx")) return 3000;
  if (c.id.includes("4xxx")) return 4000;
  return 0;
}
/* 一门课可同时属于多个分组：主归属 (cat, g) + alt 附加归属，重叠时两个大类都显示 */
function inGroup(c, cat, g) {
  return [{ cat: c.cat, g: c.g }, ...(c.alt || [])]
    .some(e => e.cat === cat && (g == null || e.g === g));
}

function renderTime() {
  const s = new Date(DATA.time.start), e = new Date(DATA.time.end), now = new Date();
  const pct = Math.max(0, Math.min(100, (now - s) / (e - s) * 100));
  document.getElementById("timePct").textContent = pct.toFixed(1) + "%";
  document.getElementById("timeFill").style.width = pct + "%";
  document.getElementById("timeNote").textContent =
    `${DATA.time.start} 入学 → ${DATA.time.end} 毕业 · 剩余约 ${Math.max(0, Math.round((e - now) / 86400000))} 天`;
}

/* ---------- 模块A：课程进度（深色=已完成，浅色=进行中） ---------- */
function renderProgress() {
  let got = 0, lite = 0, total = 0;
  const html = Object.entries(DATA.requirements).map(([k, req], i) => {
    const list = DATA.courses.filter(c => c.cat === k);
    const done = list.filter(c => statuses[c.id] === "done");
    const inprog = list.filter(c => statuses[c.id] === "progress");
    const doneCr = done.reduce((a, c) => a + c.credit, 0);
    const progCr = inprog.reduce((a, c) => a + c.credit, 0);
    const counted = Math.min(req.need, doneCr);
    const liteCr = Math.min(req.need - counted, progCr);
    got += counted; lite += liteCr; total += req.need;
    const pct = req.need ? counted / req.need * 100 : 0;
    const litePct = req.need ? liteCr / req.need * 100 : 0;
    return `<div class="subcat">
      <div class="bar-row">
        <span class="bar-label">${req.name}　已完成 ${doneCr}（进行中 ${progCr}）/ 要求 ${req.need} ${req.unit}</span>
        <span class="bar-label">${pct.toFixed(0)}%${litePct ? " +" + litePct.toFixed(0) + "%" : ""}</span>
      </div>
      <div class="track">
        <div class="fill fill-${i+1}" style="width:${pct}%"></div>
        <div class="fill fill-${i+1} lite" style="left:${pct}%;width:${litePct}%"></div>
      </div>
    </div>`;
  }).join("");
  document.getElementById("subcats").innerHTML = html;
  const pct = total ? got / total * 100 : 0;
  const litePct = total ? lite / total * 100 : 0;
  document.getElementById("coursePct").textContent = pct.toFixed(1) + "%" + (lite ? " (+" + lite + "学分进行中)" : "");
  document.getElementById("courseFill").style.width = pct + "%";
  const lf = document.getElementById("courseFillLite");
  lf.style.left = pct + "%"; lf.style.width = Math.min(litePct, 100 - pct) + "%";
  document.getElementById("courseNote").textContent = "深色 = 已完成，浅色 = 进行中（不计入完成进度）；各类超出要求的部分不计入";
}

/* 重叠课程状态按大类独立：主归属用课号作键，附加归属用 "课号::组" 作键 */
function ctxKey(c, g) { return g == null || c.g === g ? c.id : c.id + "::" + g; }
function getStatus(key, c) { return statuses[key] !== undefined ? statuses[key] : c.status; }

function zoneSetsFor(cat) {
  if (cat === "isd") return [
    { g: "engReq", title: "工科必修 · COMP / MATH / PHYS", need: 12, filter: c => inGroup(c, "isd", "engReq") },
    { g: "langReq", title: "语言必修 · LANG", need: 3, filter: c => inGroup(c, "isd", "langReq"), simple: true },
    { g: "isdReq", title: "ISDN 必修", need: 45, filter: c => inGroup(c, "isd", "isdReq"), hidePlanned: true },
    { g: "bizE", title: "商学选修 · 创业E", need: 6, filter: c => inGroup(c, "isd", "bizE") },
    { g: "projE", title: "工科选修 · 项目E ｜ 高阶课 (3000+，需12学分，两类合计21学分)", need: 12, filter: c => inGroup(c, "isd", "projE") && levelOf(c) >= 3000 },
    { g: "projE", title: "工科选修 · 项目E ｜ 低阶课 (1000/2000级，需9学分，1000级最多计3学分)", need: 9, filter: c => inGroup(c, "isd", "projE") && levelOf(c) < 3000 },
  ];
  if (cat === "pbs") return [
    { g: "pbsReq", title: "必修 · 入门课三选一 + 研究方法", need: 6, filter: c => inGroup(c, "pbs", "pbsReq") },
    { g: "pbsListA", title: "List A · SOSC 选修（需6学分 = 2门）", need: 6, filter: c => inGroup(c, "pbs", "pbsListA") },
    { g: "pbsListB", title: "List B · SBM 选修（需3学分 = 1门；两List合计1000级≤1门）", need: 3, filter: c => inGroup(c, "pbs", "pbsListB") },
  ];
  return [{ g: null, title: null, filter: c => inGroup(c, "cc", null) }];
}

function zoneChips(zs, st) {
  return DATA.courses.filter(c => {
    if (!zs.filter(c) || isBound(c.id)) return false;
    const s = getStatus(ctxKey(c, zs.g), c);
    if (st === "done") return s === "done";
    if (st === "progress") return s === "progress";
    if (st === "planned") return s === "planned";
    return s === "other" || s === "planned"; // "other" 栏同时收纳误设为 planned 的课
  }).map(c => ({ c, key: ctxKey(c, zs.g) }));
}
const isBusy = () => false;
const collapsedKeys = new Set();
let ZS = {}; // 渲染时登记每个分区所属的大类 {key: {filter, need}}，供拖拽时校验

function renderBoard() {
  ZS = {};
  let html = "";
  for (const [cat, catName] of Object.entries(CATS)) {
    const slotBoard = cat === "cc" ? ccSlotBoard() : "";
    const zonesHtml = zoneSetsFor(cat).map((zs, zi) => {
      ZS[cat + ":" + zi] = zs;
      const zoneDefs = zs.simple
        ? [["done", "已完成 ✅"], ["other", "未完成 ⬜"]]
        : zs.hidePlanned
          ? [["done", "已完成 ✅"], ["progress", "进行中 🔄"], ["other", "其他"]]
          : Object.entries(STS);
      const groupList = DATA.courses.filter(zs.filter);
      const doneCr = groupList.filter(c => getStatus(ctxKey(c, zs.g), c) === "done").reduce((a, c) => a + c.credit, 0);
      const denom = zs.need || groupList.reduce((a, c) => a + c.credit, 0);
      const complete = doneCr >= denom;
      const cKey = cat + "::" + (zs.title || "all");
      const collapseId = "collapse-" + cat + "-" + (zs.title || "all").replace(/\W/g, "");
      const zones = zoneDefs.map(([st, label]) => {
        const list = zoneChips(zs, st);
        const isCollapsible = complete && list.length > 0 && st !== "done";
        const collapsed = isCollapsible && collapsedKeys.has(cKey);
        return `<div>
          <div class="zone-title">${label} <span class="count">（${list.length}）</span>${
            isCollapsible ? ` <a href="javascript:void(0)" data-collapse="${cKey}" data-target="${collapseId}"
              style="font-size:11px;color:var(--accent);font-weight:400">${collapsed ? "▸ 展开" : "▾ 收起"}</a>` : ""
          }</div>
          <div class="drop-zone" data-cat="${cat}" data-status="${st}" data-zs="${cat}:${zi}" id="${collapseId}"
            style="${collapsed ? "display:none" : ""}">
            ${collapsed ? "" : (list.map(x => chipHTML(x.c, x.key)).join("") || `<span class="empty-hint">拖动课号到这里</span>`)}
          </div>
        </div>`;
      }).join("");
      let progLabel = "";
      if (zs.title) progLabel = ` <span style="font-weight:700">（已完成 ${Math.min(doneCr, denom)} / ${denom} 学分）${complete ? " ✅" : ""}</span>`;
      return (zs.title ? `<div class="slot-group-title" style="color:#4f6ef7;margin-top:14px">${zs.title}${progLabel}</div>` : "") +
             `<div class="zone-grid">${zones}</div>`;
    }).join("");
    html += `<div class="course-card">
      <h2>${catName} <span style="font-weight:400;font-size:13px;color:var(--muted)">要求 ${DATA.requirements[cat].need} ${DATA.requirements[cat].unit}</span></h2>
      ${slotBoard}
      ${zonesHtml}
    </div>`;
  }
  html += `<div class="course-card" id="freeCard">
    <h2>Free Credits <span style="font-weight:400;font-size:13px;color:var(--muted)">要求 3 学分 · 已计入 <b id="freeDone">0</b> / 3 学分</span></h2>
    <div class="desc">输入课号和学分添加（如转学分、超修课等）；点击方块 = 标记已完成；右键单击 = 删除</div>
    <div class="drop-zone" id="freeZone" style="min-height:52px"></div>
    <div class="add-row">
      <input id="freeIdInput" placeholder="课号，如 MATH 1014" style="width:180px" />
      <input id="freeCrInput" placeholder="学分" type="number" min="0" step="1" style="width:70px" />
      <button id="freeAddBtn">＋ 添加</button>
    </div>
  </div>`;
  html += `<div class="tools"><button class="reset" id="resetBtn">重置全部分类与匹配</button></div>`;
  const mb = document.getElementById("moduleB");
  mb.innerHTML = html;
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("重置所有状态、槽位匹配和自定义课程？")) {
      localStorage.removeItem(STORE_KEY);
      location.reload();
    }
  };
  const btn = document.getElementById("ccAddBtn");
  if (btn) btn.onclick = () => {
    const inp = document.getElementById("ccAddInput");
    const id = inp.value.trim().toUpperCase();
    if (!id) return;
    if (byId[id]) { alert("该课号已存在"); return; }
    const c = { id, name: "自定义课程", cat: "cc", credit: 3, status: "other", custom: true };
    DATA.courses.push(c); byId[id] = c; customIds.push(id);
    statuses[id] = "other"; // 关键：新课程也要登记状态，否则方块无法渲染
    save(); renderAll();
  };
  renderFree();
}

/* ---------- Free Credits ---------- */
function renderFree() {
  const zone = document.getElementById("freeZone");
  if (!zone) return;
  zone.innerHTML = freeCredits.map((f, i) =>
    `<span class="chip ${f.done ? "done" : "other"}" data-free="${i}" draggable="false"
      title="点击标记已完成 · 右键单击删除">${f.id} · ${f.credit}学分</span>`
  ).join("") || `<span class="empty-hint">上方输入课号与学分后添加</span>`;
  const doneCr = freeCredits.filter(f => f.done).reduce((a, f) => a + f.credit, 0);
  document.getElementById("freeDone").textContent = Math.min(doneCr, 3);
  document.getElementById("freeDone").style.color = doneCr >= 3 ? "#34a374" : "";
}

function wireFree() {
  const mb = document.getElementById("moduleB");
  mb.addEventListener("click", e => {
    const chip = e.target.closest("[data-free]");
    if (!chip) return;
    const f = freeCredits[+chip.dataset.free];
    if (f) { f.done = !f.done; save(); renderFree(); }
  });
  mb.addEventListener("contextmenu", e => {
    const chip = e.target.closest("[data-free]");
    if (!chip) return;
    e.preventDefault();
    freeCredits.splice(+chip.dataset.free, 1);
    save(); renderFree();
  });
  document.getElementById("freeAddBtn").onclick = () => {
    const id = document.getElementById("freeIdInput").value.trim().toUpperCase();
    const cr = parseFloat(document.getElementById("freeCrInput").value);
    if (!id) return;
    if (freeCredits.some(f => f.id === id)) { alert("该课号已添加"); return; }
    freeCredits.push({ id, credit: isNaN(cr) ? 3 : cr, done: false });
    save(); renderFree();
    document.getElementById("freeIdInput").value = "";
    document.getElementById("freeCrInput").value = "";
  };
}

/* ---------- 拖拽 ---------- */
let drag = null;
document.addEventListener("dragstart", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  drag = { id: chip.dataset.id, fromSlot: chip.dataset.fromSlot || null };
  chip.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragend", e => {
  document.querySelectorAll(".chip.dragging").forEach(c => c.classList.remove("dragging"));
  drag = null;
});

document.getElementById("moduleB").addEventListener("dragover", e => {
  const t = e.target.closest(".drop-zone, .slot.drop-target");
  if (!t) return;
  e.preventDefault();
  t.classList.add("drag-over");
});
document.getElementById("moduleB").addEventListener("dragleave", e => {
  e.target.closest(".drop-zone, .slot.drop-target")?.classList.remove("drag-over");
});
/* 大类是否已修满：该组已完成学分 ≥ 要求学分 */
function groupFull(key) {
  const zs = ZS[key];
  if (!zs || !zs.need) return false;
  const doneCr = DATA.courses.filter(zs.filter)
    .filter(c => getStatus(ctxKey(c, zs.g), c) === "done").reduce((a, c) => a + c.credit, 0);
  return doneCr >= zs.need;
}

document.getElementById("moduleB").addEventListener("drop", e => {
  const zone = e.target.closest(".drop-zone");
  const slot = e.target.closest(".slot.drop-target");
  if (!drag) return;
  const { id, fromSlot } = drag;
  if (zone) {
    const st = zone.dataset.status;
    if (st === "planned" && groupFull(zone.dataset.zs)) {
      alert("该大类学分已修满，不能再计划更多课程");
      return;
    }
    // 放到状态分区：解除槽位匹配并设置状态
    if (fromSlot) { bindings[fromSlot] = (bindings[fromSlot] || []).filter(x => x !== id); }
    Object.keys(bindings).forEach(k => bindings[k] = (bindings[k] || []).filter(x => x !== id));
    statuses[id] = zone.dataset.status;
    save(); renderAll();
  } else if (slot && byId[id]?.cat === "cc") {
    // 放到 CC 槽位：匹配（一个槽可容纳多门课，如 E-Comm 两门）
    const key = slot.dataset.slot;
    Object.keys(bindings).forEach(k => bindings[k] = (bindings[k] || []).filter(x => x !== id));
    if (fromSlot) bindings[fromSlot] = (bindings[fromSlot] || []).filter(x => x !== id);
    (bindings[key] = bindings[key] || []).push(id);
    save(); renderAll();
  }
});
/* 点击「收起/展开」：折叠或展开已完成大类的「其他」栏 */
document.getElementById("moduleB").addEventListener("click", e => {
  const toggle = e.target.closest("a[data-collapse]");
  if (toggle) {
    const key = toggle.dataset.collapse;
    collapsedKeys.has(key) ? collapsedKeys.delete(key) : collapsedKeys.add(key);
    renderBoard();
    return;
  }
  const chip = e.target.closest(".chip[data-from-slot]");
  if (!chip) return;
  const order = ["done", "progress", "planned", "other"];
  const cur = statuses[chip.dataset.id];
  statuses[chip.dataset.id] = order[(order.indexOf(cur) + 1) % order.length];
  save(); renderAll();
});
document.getElementById("moduleB").addEventListener("dblclick", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const id = chip.dataset.id;
  /* 双击 ELEC 3xxx/4xxx：编辑课号 */
  if (chip.dataset.editable) {
    const newId = (prompt(`将 ${id} 替换为实际课号：`, id) || "").trim().toUpperCase();
    if (!newId || newId === id) return;
    if (byId[newId]) { alert("该课号已存在"); return; }
    const c = byId[id];
    renames[id] = newId;
    c.id = newId; c.editId = true; c.name = c.name.replace(/（双击编辑课号）/, "");
    byId[newId] = c; delete byId[id];
    if (statuses[id]) { statuses[newId] = statuses[id]; delete statuses[id]; }
    save(); renderAll();
    return;
  }
  /* 双击 ELEC 3xxx/4xxx：编辑课号（编辑保留双击，删除统一用右键） */
  if (!chip.dataset.editable) return;
  const newId = (prompt(`将 ${id} 替换为实际课号：`, id) || "").trim().toUpperCase();
  if (!newId || newId === id) return;
  if (byId[newId]) { alert("该课号已存在"); return; }
  const c = byId[id];
  renames[id] = newId;
  c.id = newId; c.editId = true; c.name = c.name.replace(/（双击编辑课号）/, "");
  byId[newId] = c; delete byId[id];
  if (statuses[id]) { statuses[newId] = statuses[id]; delete statuses[id]; }
  save(); renderAll();
});
/* 右键单击自定义课：删除 */
document.getElementById("moduleB").addEventListener("contextmenu", e => {
  const chip = e.target.closest(".chip.custom");
  if (!chip) return;
  e.preventDefault();
  const id = chip.dataset.id;
  if (!confirm(`删除自定义课程 ${id}？`)) return;
  Object.keys(bindings).forEach(k => bindings[k] = (bindings[k] || []).filter(x => x !== id));
  delete statuses[id]; delete byId[id];
  customIds = customIds.filter(x => x !== id);
  DATA.courses = DATA.courses.filter(c => c.id !== id);
  save(); renderAll();
});

function renderAll() { renderProgress(); renderBoard(); }
renderTime();
renderAll();
wireFree();
setInterval(renderTime, 60000);
</script>
